<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bảng thông báo</title>

<style>

body{
margin:0;
font-family:Arial,system-ui;
background:#111;
color:#fff;
overflow:hidden;
transform:scale(2);
transform-origin:top left;
width:50%;
}

#header{
height:60px;
line-height:60px;
text-align:center;
font-size:28px;
font-weight:700;
background:#8b0000;
color:#ffd700;
}

#viewport{
height:calc(100vh - 60px);
overflow:auto;
padding:10px;
}

.section{
margin:25px 0 10px;
padding:10px;
font-size:24px;
font-weight:700;
background:#b22222;
}

table{
width:100%;
border-collapse:collapse;
font-size:22px;
margin-bottom:25px;
}

th{
background:#660000;
color:#ffeb3b;
padding:10px;
text-align:left;
}

td{
padding:10px;
border-bottom:1px solid #444;
}

/* Tên công việc rộng hơn */
#jobs th:nth-child(1),
#jobs td:nth-child(1){
width:35%;
}

/* chữ quá hạn */
.status{
color:#ff3333;
font-weight:700;
}

.no{
text-align:center;
padding:30px;
font-size:22px;
color:#ccc;
}

</style>
</head>

<body>

<div id="header">
BẢNG THEO DÕI CÔNG VIỆC & LỊCH CÔNG TÁC
</div>

<div id="viewport">

<div class="section">THEO DÕI CÔNG VIỆC</div>

<table id="jobs">
<thead></thead>
<tbody></tbody>
</table>

<div class="section">
LỊCH HỌP HÔM NAY (<span id="today"></span>)
</div>

<table id="meet">
<thead></thead>
<tbody></tbody>
</table>

<div style="height:120px"></div>

</div>

<script>

const KEY="AIzaSyDWQsIW0i67F2nVSEpMq3Rj_oT228rVsCU"
const ID="15QTF-k5nHtDqyTJ5m_LwGxPjPq0XHTFq5KLOCG9IQIg"

const SHEET1="Bảng thông báo điện tử"
const SHEET2="Lịch họp 2026"

let y=0,run=1,reload=0

const $=e=>document.querySelector(e)

function parse(d){
if(!d)return
let p=d.split("/")
return new Date(p[2],p[1]-1,p[0])
}

function notDone(s){
return !s||!s.toLowerCase().includes("hoàn thành")
}

async function init(){

$("#today").textContent=new Date().toLocaleDateString("vi-VN")

let [a,b]=await Promise.all([

fetch(`https://sheets.googleapis.com/v4/spreadsheets/${ID}/values/${encodeURIComponent(SHEET1)}!A1:H100?key=${KEY}`),

fetch(`https://sheets.googleapis.com/v4/spreadsheets/${ID}/values/${encodeURIComponent(SHEET2)}!A1:F100?key=${KEY}`)

])

let j=(await a.json()).values
let m=(await b.json()).values

jobs(j)
meet(m)

setTimeout(scroll,2000)

}

function jobs(r){

if(!r||r.length<2)return

let h=r[0]

/* sửa tên cột Ký hiệu */
h=h.map(x=>{
if(x.toLowerCase().includes("ký hiệu")) return "Ký hiệu"
return x
})

$("#jobs thead").innerHTML="<tr>"+h.map(x=>`<th>${x}</th>`).join("")+"</tr>"

let s=h.findIndex(x=>x.toLowerCase().includes("trạng"))
let d=h.findIndex(x=>x.toLowerCase().includes("thời"))

let t=new Date()
t.setHours(0,0,0,0)

let tm=new Date(t)
tm.setDate(t.getDate()+1)

let html=""

r.slice(1).forEach(row=>{

if(!row||!row[0])return

let st=row[s]||""
let dl=parse(row[d])

if(!notDone(st)||!dl||dl>tm)return

html+="<tr>"

h.forEach((_,i)=>{

let c=row[i]||""

/* CVVP chỉ lấy tên */
if(i==4 && c){
let words=c.trim().split(" ")
c=words[words.length-1]
}

/* thời hạn chỉ ngày tháng */
if(i==6 && c){
let p=c.split("/")
if(p.length==3) c=p[0]+"/"+p[1]
}

/* chữ quá hạn đỏ */
if(i==s && (c.toLowerCase().includes("quá")||c.toLowerCase().includes("trễ")))
c=`<span class="status">${c}</span>`

html+=`<td>${c}</td>`

})

html+="</tr>"

})

$("#jobs tbody").innerHTML=
html||`<tr><td colspan="${h.length}" class="no">Không có công việc.</td></tr>`

}

function meet(r){

if(!r||r.length<4)return

$("#meet thead").innerHTML="<tr>"+r[2].map(x=>`<th>${x}</th>`).join("")+"</tr>"

let n=new Date()

let today=("0"+n.getDate()).slice(-2)+"/"+("0"+(n.getMonth()+1)).slice(-2)+"/"+n.getFullYear()

let last="",html="",ok=0

for(let i=3;i<r.length;i++){

let row=r[i]

if(!row||row.length<2)continue

let d=row[0]?row[0].trim():last
if(row[0])last=row[0].trim()

if(d.includes(today)){

ok=1

html+="<tr>"

html+=`<td>${row[0]||""}</td>`

for(let k=1;k<5;k++){

let c=row[k]||""

if(k==4)c=c.replace(/\n/g,"<br>")

html+=`<td>${c}</td>`

}

html+="</tr>"

}

}

$("#meet tbody").innerHTML=
ok?html:`<tr><td colspan="5" class="no">Hôm nay không có lịch họp.</td></tr>`

}

function scroll(){

let v=$("#viewport")

function f(){

if(!run||reload){
requestAnimationFrame(f)
return
}

let m=v.scrollHeight-v.clientHeight

if(y<m){

y+=5
v.scrollTop=y

}else{

reload=1
setTimeout(()=>location.reload(),3000)
return

}

requestAnimationFrame(f)

}

requestAnimationFrame(f)

}

document.addEventListener("click",()=>run=!run)

document.addEventListener("keydown",e=>{
if(e.code=="Space"){
e.preventDefault()
run=!run
}
})

init()

</script>

</body>
</html>
